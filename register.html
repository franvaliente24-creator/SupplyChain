<!DOCTYPE html>
<html lang="en">
<head>
<link href="app.css" rel="stylesheet"/>
<script src="app.js" defer></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; }
    .label-text { font-family: 'Public Sans', sans-serif; }
</style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 p-8">
<div class="mb-8 text-center">
<h1 class="text-2xl font-headline font-bold text-on-surface">Create Account</h1>
<p class="text-on-surface-variant font-body text-sm mt-2">Register to access the Supply Chain dashboard.</p>
</div>
<form class="space-y-5" id="register-form">
<div>
<label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="username" name="username" placeholder="jdelacruz" required type="text" minlength="2" maxlength="50"/>
</div>
</div>
<div>
<label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="email" name="email" placeholder="you@example.com" required type="email"/>
</div>
</div>
<div>
<label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="role">Role</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">badge</span>
</div>
<select class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="role" name="role" required>
<option value="Administrator">Administrator</option>
<option value="Supply Chain Manager">Supply Chain Manager</option>
<option value="Staff" selected>Staff</option>
</select>
</div>
</div>
<div>
<label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="password" name="password" placeholder="At least 8 characters" required type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button" aria-label="Toggle password visibility" title="Toggle visibility">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div>
<label class="block label-text text-sm font-medium text-on-surface-variant mb-1.5" for="confirm-password">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button" aria-label="Toggle confirm password visibility" title="Toggle visibility">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
Create Account
</button>
</div>
</form>
<div class="mt-6 text-center">
<a class="text-sm font-medium text-primary hover:text-primary-container transition-colors label-text" href="index.html" id="sign-in-link">
Already have an account? Sign in
</a>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const BASE = window.APP_BASE_URL || '/SupplyChain';

    const params = new URLSearchParams(window.location.search);
    const subsystem = params.get('subsystem');
    const signInLink = document.getElementById('sign-in-link');
    if (subsystem && signInLink) {
        signInLink.href = `index.html?subsystem=${encodeURIComponent(subsystem)}`;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const usernameEl = document.getElementById('username');
        const emailEl = document.getElementById('email');
        const roleEl = document.getElementById('role');
        const passwordEl = document.getElementById('password');
        const confirmPasswordEl = document.getElementById('confirm-password');

        const username = (usernameEl.value || '').trim();
        const email = (emailEl.value || '').trim();
        const role = roleEl.value;
        const password = passwordEl.value;
        const confirmPassword = confirmPasswordEl.value;

        const submitBtn = document.getElementById('register-button')
            || e.target.querySelector('button[type="submit"]')
            || e.target.querySelector('button:not([type])');
        const originalHTML = submitBtn ? submitBtn.innerHTML : null;
        let restored = false;
        const restoreBtn = () => {
            if (restored || !submitBtn) return;
            restored = true;
            submitBtn.disabled = false;
            submitBtn.style.opacity = '';
            submitBtn.style.pointerEvents = '';
            if (originalHTML !== null) submitBtn.innerHTML = originalHTML;
        };

        try {
            if (!/^[A-Za-z0-9_.-]{2,50}$/.test(username)) {
                alert('Please enter a valid username (2-50 chars, letters, numbers, _ . - only).');
                usernameEl.focus();
                return;
            }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('Please enter a valid email address.');
                emailEl.focus();
                return;
            }
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                confirmPasswordEl.focus();
                return;
            }
            if (password.length < 8) {
                alert('Password must be at least 8 characters long.');
                passwordEl.focus();
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.8';
                submitBtn.style.pointerEvents = 'none';
                submitBtn.innerHTML = '<span>Creating account...</span>';
            }

            const response = await fetch(`${BASE}/register.php`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    username,
                    email,
                    role,
                    password,
                    confirm_password: confirmPassword
                }),
            });

            const contentType = response.headers.get('content-type') || '';
            let data = {};
            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                const raw = await response.text();
                const s = raw.indexOf('{');
                const en = raw.lastIndexOf('}');
                if (s !== -1 && en !== -1) {
                    try { data = JSON.parse(raw.slice(s, en + 1)); }
                    catch (_) { data = { message: raw.slice(0, 180) }; }
                } else {
                    data = { message: raw.slice(0, 180) };
                }
            }

            if (response.ok) {
                alert('Account created successfully! Please sign in.');
                const target = subsystem ? `index.html?subsystem=${encodeURIComponent(subsystem)}` : 'index.html';
                window.location.href = target;
                return;
            }

            alert(data.message || 'Could not create account.');
        } catch (error) {
            console.error('Error:', error);
            const details = (error && error.message) ? `\n\nDetails: ${error.message}` : '';
            alert(`An error occurred. Please try again.${details}`);
        } finally {
            restoreBtn();
        }
    });
});
</script>
</body>
</html>
