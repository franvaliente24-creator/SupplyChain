<!DOCTYPE html>

<html lang="en"><head>
<link href="app.css" rel="stylesheet"/>
<script src="app.js" defer></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 font-body text-on-surface antialiased">
<!-- Forgot Password Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 p-8 sm:p-10 transition-all duration-300 hover:shadow-xl">
<!-- Header -->
<div class="mb-8 text-center sm:text-left">
<h1 class="font-headline text-2xl font-bold tracking-tight text-on-surface mb-3">Forgot your password?</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">
                No problem. Just let us know your email address and we will email you a password reset link that will allow you to choose a new one.
            </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" id="forgot-password-form" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl">mail</span>
</div>
<input autofocus="" class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg bg-surface-bright text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container focus:border-primary-container sm:text-sm transition-shadow duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors duration-200 active:scale-[0.98]" type="submit">
                    Email Password Reset Link
                </button>
</div>
</form>
<!-- Footer / Back Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center justify-center font-label text-sm font-medium text-primary hover:text-primary-container transition-colors duration-200 group" href="index.html" id="back-to-login-link">
    <span class="material-symbols-outlined text-lg mr-1 group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>
    Back to login
</a>
</div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const BASE = window.APP_BASE_URL || '/SupplyChain';

        const params = new URLSearchParams(window.location.search);
        const subsystem = params.get('subsystem');
        const backLink = document.getElementById('back-to-login-link');
        if (subsystem && backLink) {
            backLink.href = `index.html?subsystem=${encodeURIComponent(subsystem)}`;
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailEl = document.getElementById('email');
            const email = (emailEl.value || '').trim();

            const submitBtn = document.getElementById('reset-link-button')
                || e.target.querySelector('button[type="submit"]')
                || e.target.querySelector('button:not([type])');
            const originalHTML = submitBtn ? submitBtn.innerHTML : null;
            let restored = false;
            const restoreBtn = () => {
                if (restored || !submitBtn) return;
                restored = true;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '';
                submitBtn.style.pointerEvents = '';
                submitBtn.style.backgroundColor = '';
                submitBtn.style.borderColor = '';
                submitBtn.style.color = '';
                if (originalHTML !== null) submitBtn.innerHTML = originalHTML;
            };

            try {
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('Please enter a valid email address.');
                    if (emailEl) emailEl.focus();
                    return;
                }

                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.8';
                    submitBtn.style.pointerEvents = 'none';
                    submitBtn.innerHTML = '<span>Sending reset link...</span>';
                }

                const response = await fetch(`${BASE}/reset_info.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email }),
                });

                const contentType = response.headers.get('content-type') || '';
                let data = {};
                if (contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const raw = await response.text();
                    const s = raw.indexOf('{');
                    const en = raw.lastIndexOf('}');
                    if (s !== -1 && en !== -1) {
                        try { data = JSON.parse(raw.slice(s, en + 1)); }
                        catch (_) { data = { message: raw.slice(0, 180) }; }
                    } else {
                        data = { message: raw.slice(0, 180) };
                    }
                }

                if (response.ok) {
                    let message = data.message || 'If that email exists, a reset link has been generated.';
                    if (data.reset_url) {
                        const devMsg = `\n\n[Development] Reset link: ${data.reset_url}`;
                        try {
                            await navigator.clipboard.writeText(data.reset_url);
                            message += devMsg + '\n(Copied to clipboard)';
                        } catch (_) {
                            message += devMsg;
                        }
                    }
                    alert(message);
                    return;
                }

                alert(data.message || 'Failed to send reset link. Please try again.');
            } catch (error) {
                console.error('Error:', error);
                const details = (error && error.message) ? `\n\nDetails: ${error.message}` : '';
                alert(`Unable to reach the server. Make sure XAMPP Apache and MySQL are running, then try again.${details}`);
            } finally {
                restoreBtn();
            }
        });
    });
</script>
</body></html>
